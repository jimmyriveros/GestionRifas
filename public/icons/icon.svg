<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Gestión de Rifas">
  <!--
    ICONO PROVISIONAL de la aplicación instalada (D-115).

    NO es un logo de la empresa: el proyecto no tiene ninguno. Es un marcador de
    posición dibujado a propósito para que la aplicación se pueda instalar hoy y
    para que sustituirlo sea cambiar este archivo y volver a generar los PNG.

    QUÉ DIBUJA. Una boleta con la línea de corte en el centro, porque una boleta
    de esta aplicación tiene DOS números —el diario y el semanal— y esa es su
    única particularidad visible. Los colores salen de `globals.css`: el fondo es
    el `primary` del tema claro (neutral-900) y la boleta, el verde de `success`,
    el mismo de la marca «estás aquí» de la barra inferior.

    SIN TEXTO a propósito: a 48 px en la pantalla de inicio de un teléfono
    ninguna palabra se lee, y un icono con letras ilegibles se ve peor que uno
    sin ellas.
  -->
  <rect width="512" height="512" fill="#171717" />

  <!--
    La boleta. `mask` en vez de dos círculos pintados del color del fondo: así el
    mismo dibujo sirve sobre cualquier fondo, incluido el recorte que Android
    aplica a los iconos «maskable».
  -->
  <mask id="notches">
    <rect width="512" height="512" fill="#fff" />
    <circle cx="106" cy="256" r="26" fill="#000" />
    <circle cx="406" cy="256" r="26" fill="#000" />
  </mask>

  <g mask="url(#notches)">
    <rect x="106" y="156" width="300" height="200" rx="28" fill="#10b981" />
  </g>

  <!-- Línea de corte: separa el número diario del semanal. -->
  <line
    x1="256"
    y1="186"
    x2="256"
    y2="326"
    stroke="#171717"
    stroke-width="10"
    stroke-linecap="round"
    stroke-dasharray="18 20"
  />
</svg>
