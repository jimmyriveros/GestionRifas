<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Gestión de Rifas">
  <!--
    Variante «maskable» del icono (D-115).

    Es el MISMO dibujo que `icon.svg`, más pequeño. Android recorta los iconos
    que declaran `purpose: "maskable"` con la forma que elija el fabricante
    —círculo, cuadrado redondeado, gota—, y solo garantiza que se vea el círculo
    central del 80 % del lienzo: 409,6 px de los 512.

    La boleta mide aquí 240 × 160, cuya diagonal son 288 px: entra con holgura en
    ese círculo, así que ningún recorte le corta una esquina. El fondo llega a
    los bordes a propósito, porque lo que sobre del recorte tiene que ser fondo,
    nunca transparencia.
  -->
  <rect width="512" height="512" fill="#171717" />

  <mask id="notches">
    <rect width="512" height="512" fill="#fff" />
    <circle cx="136" cy="256" r="21" fill="#000" />
    <circle cx="376" cy="256" r="21" fill="#000" />
  </mask>

  <g mask="url(#notches)">
    <rect x="136" y="176" width="240" height="160" rx="22" fill="#10b981" />
  </g>

  <line
    x1="256"
    y1="200"
    x2="256"
    y2="312"
    stroke="#171717"
    stroke-width="8"
    stroke-linecap="round"
    stroke-dasharray="14 16"
  />
</svg>
